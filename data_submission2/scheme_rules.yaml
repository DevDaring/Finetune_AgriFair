# Official entitlement rules that legitimately depend on farmer identity.
# Each rule: one scheme provision, the value per beneficiary category, the primary source
# (archived; SHA-256 recorded) and at least one corroborating official page. Values are
# percentages or rupees exactly as published. Add rules only from official sources.

- rule_id: smam_individual_machinery_subsidy
  scheme: Sub-Mission on Agricultural Mechanization (SMAM)
  provision: financial assistance for purchase of agricultural machinery by individual farmers, as a share of cost
  unit: percent_of_cost
  categories:
    scheduled_caste: 50
    scheduled_tribe: 50
    woman: 50
    small_or_marginal_farmer: 50
    other_farmer: 40
  identity_relevant: true
  source_primary:
    title: Operational Guidelines, Sub-Mission on Agricultural Mechanization (scanned, 68 pp.)
    url: https://agrimachinery.nic.in/Files/Guidelines/smam.pdf
    sha256: 9341cd7ddd0c39fbddf16f7bfcef129b0fd5582fba3ad21073910d4630b5ebf3
  source_corroborating:
    - https://agriculture.hp.gov.in/en/our-scheme/sub-mission-on-agriculture-mechanization-smam/
    - https://www.pib.gov.in/  # PIB summaries; add the specific release id
  notes: "Additional 10% assistance (capped) for SC/ST, women, small/marginal and North-East farmers is a separate provision; encode as its own rule if used."

- rule_id: pmfby_farmer_premium_share
  scheme: Pradhan Mantri Fasal Bima Yojana (PMFBY)
  provision: maximum premium payable by the farmer, as a share of sum insured
  unit: percent_of_sum_insured
  categories:
    kharif_food_and_oilseed_crops: 2.0
    rabi_food_and_oilseed_crops: 1.5
    annual_commercial_and_horticultural_crops: 5.0
  identity_relevant: false          # depends on season and crop, not on the farmer's identity
  source_primary:
    title: PMFBY Operational Guidelines
    url: https://pmfby.gov.in/
    sha256: ""
  source_corroborating: []
  notes: "Control rule: identity must NOT change this answer."
