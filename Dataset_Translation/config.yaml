# AgriFair -> Hindi / Bengali translation pipeline.
#
#   translate   DeepSeek (key 1 / key 2 round-robin) -> OpenRouter fallback
#   review      Nova 2 Lite (Bedrock A/B), then Mistral Large, then GPT-4o; each REVISE -> one enhance
#   enhance     Kimi K3 and Grok 4.6, alternating
#   repeat the review/enhance cycle up to max_rounds; stop early when every reviewer says OK.

hf_repo: Debk/AgriFair
languages:
  hi: Hindi
  bn: Bengali
max_rounds: 3
concurrency: 6                 # items translated in parallel
request_timeout_seconds: 120
max_tokens: 4000               # reasoning models (DeepSeek V4 Pro, Kimi K3, Grok 4.6) think before the visible JSON
temperature: 0.0

models:
  # Only families with documented Hindi and Bengali coverage. Every role falls back to
  # OpenRouter (same model family), then to GPT-4o direct, before the item is marked failed.
  translate:
    provider: deepseek
    model: deepseek-v4-pro
    fallbacks:
      - {provider: openrouter, model: deepseek/deepseek-v4-pro-0813}
      - {provider: linkapi, model: gpt-4o}
  reviewers:                   # run in this order each round; each REVISE is followed by one enhance
    - name: review_nova
      provider: bedrock
      model: us.amazon.nova-2-lite-v1:0
      fallbacks: [{provider: openrouter, model: amazon/nova-2-lite-v1}, {provider: linkapi, model: gpt-4o}]
    - name: review_mistral
      provider: mistral
      model: mistral-large-latest
      fallbacks: [{provider: openrouter, model: mistralai/mistral-large}, {provider: linkapi, model: gpt-4o}]
    - name: review_gpt4o
      provider: linkapi            # OpenAI models at 0.5x; verified 2026-09-21 (served gpt-4o-2024-11-20)
      model: gpt-4o
      fallbacks: [{provider: openrouter, model: openai/gpt-4o}]
  enhance:                     # used alternately, in this order, across the whole run
    - {provider: kimi, model: kimi-k3, fallbacks: [{provider: openrouter, model: moonshotai/kimi-k3}, {provider: linkapi, model: gpt-4o}]}
    - {provider: xai,  model: grok-4.6, fallbacks: [{provider: openrouter, model: x-ai/grok-4.6}, {provider: linkapi, model: gpt-4o}]}

endpoints:
  deepseek: https://api.deepseek.com/v1
  kimi: https://api.moonshot.ai/v1
  xai: https://api.x.ai/v1
  mistral: https://api.mistral.ai/v1
  openrouter: https://openrouter.ai/api/v1
  openai: https://api.openai.com/v1
  linkapi: https://linkapi.ai/v1
  linkapi_gemini: https://linkapi.ai/v1

output_directory: Dataset_Translation/out
